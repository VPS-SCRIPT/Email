<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ActiveVPN - Secure Temp Mail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-indigo-600 selection:text-white">

    <!-- Top Navigation -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="https://raw.githubusercontent.com/VPS-SCRIPT/activevpn.net/main/image/1786624647999.png" alt="Logo" class="w-9 h-9 object-contain" onerror="this.src='https://via.placeholder.com/36'">
                <div class="flex items-center gap-2">
                    <span class="font-bold text-slate-900 tracking-tight text-lg">ActiveVPN</span>
                    <span class="text-xs font-semibold px-2 py-0.5 bg-indigo-50 text-indigo-600 rounded-md border border-indigo-100">Mail Suite</span>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <a href="https://t.me/Pussy1990" target="_blank" class="flex items-center gap-2 px-3.5 py-1.5 bg-sky-50 hover:bg-sky-100 border border-sky-200 text-sky-700 rounded-full text-xs font-semibold transition-colors shadow-2xs">
                    <i class="fa-brands fa-telegram text-sm"></i> Contact Support
                </a>
                <div class="hidden sm:flex items-center gap-2 px-3 py-1 bg-emerald-50 border border-emerald-200 rounded-full text-emerald-700 text-xs font-medium">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Operational
                </div>
            </div>
        </div>
    </header>

    <!-- Main Layout -->
    <main class="max-w-7xl w-full mx-auto flex-1 flex flex-col lg:flex-row p-4 lg:p-6 gap-6">
        
        <!-- Left Sidebar: Management Panel -->
        <section class="w-full lg:w-85 flex flex-col gap-4">
            <div class="bg-white rounded-2xl border border-slate-200 shadow-xs p-5 flex flex-col gap-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Active Addresses</h2>
                    <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md"><span id="emailCount">0</span> / 5</span>
                </div>
                <button onclick="generateNewEmail()" id="generateBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-4 rounded-xl transition-all shadow-sm flex items-center justify-center gap-2 text-sm active:scale-[0.98]">
                    <i class="fa-solid fa-plus text-xs"></i> Generate New Email
                </button>
                <p id="limitWarning" class="text-rose-500 text-xs text-center hidden font-medium">Maximum limit of 5 emails reached.</p>
            </div>

            <!-- Email List Box -->
            <div class="bg-white rounded-2xl border border-slate-200 shadow-xs flex-1 flex flex-col overflow-hidden min-h-[260px] lg:min-h-[360px]">
                <div class="px-4 py-3 border-b border-slate-100 bg-slate-50/50 text-xs font-bold text-slate-400 uppercase tracking-wider">
                    Inbox Accounts
                </div>
                <div class="flex-1 overflow-y-auto p-3 space-y-2" id="emailList">
                    <!-- Dynamic List -->
                </div>
            </div>
        </section>

        <!-- Right Content: Workspace & Inbox -->
        <section class="flex-1 bg-white rounded-2xl border border-slate-200 shadow-xs flex flex-col overflow-hidden">
            <!-- Active Mail Control Header -->
            <div class="p-5 border-b border-slate-200 bg-slate-50/50 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div class="w-full sm:w-auto overflow-hidden">
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-1">Selected Mailbox</span>
                    <div class="flex items-center gap-2">
                        <span class="text-base sm:text-lg font-bold text-slate-900 truncate select-all font-mono" id="currentEmailDisplay">No mailbox selected</span>
                        <button onclick="copyCurrentEmail()" id="copyBtn" class="hidden text-slate-400 hover:text-indigo-600 p-2 rounded-lg hover:bg-slate-100 transition-colors shrink-0" title="Copy Address">
                            <i class="fa-regular fa-copy text-sm"></i>
                        </button>
                    </div>
                </div>
                <button onclick="fetchInbox()" class="bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 px-4 py-2.5 rounded-xl text-sm font-semibold transition-all flex items-center gap-2 shadow-2xs shrink-0 active:scale-95">
                    <i class="fa-solid fa-rotate-right text-xs" id="refreshIcon"></i> Refresh Inbox
                </button>
            </div>

            <!-- Messages Stream Area -->
            <div class="flex-1 overflow-y-auto p-4 lg:p-6 space-y-4 bg-slate-50/30" id="inboxContainer">
                <div class="h-full flex flex-col items-center justify-center text-slate-400 space-y-3 py-16">
                    <div class="w-14 h-14 rounded-2xl bg-slate-100 flex items-center justify-center text-slate-400 text-xl shadow-inner">
                        <i class="fa-solid fa-inbox"></i>
                    </div>
                    <p class="text-sm font-semibold text-slate-600">No incoming messages</p>
                    <p class="text-xs text-center max-w-xs text-slate-400">Use this email address anywhere to receive OTP verifications instantly.</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Application Script -->
    <script>
        const DOMAIN = 'activevpn.net';
        const MAX_EMAILS = 5;
        const API_BASE_URL = 'https://email.activevpn2026.workers.dev'; 
        
        let emails = JSON.parse(localStorage.getItem('temp_emails')) || [];
        let selectedEmail = emails.length > 0 ? emails[0] : null;

        function saveEmails() {
            localStorage.setItem('temp_emails', JSON.stringify(emails));
            renderEmailList();
            updateCurrentEmailDisplay();
        }

        function generateRandomString(length) {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        function generateNewEmail() {
            if (emails.length >= MAX_EMAILS) {
                const warning = document.getElementById('limitWarning');
                warning.classList.remove('hidden');
                setTimeout(() => warning.classList.add('hidden'), 3500);
                return;
            }
            const newAddress = `${generateRandomString(8)}@${DOMAIN}`;
            emails.unshift(newAddress);
            selectedEmail = newAddress;
            saveEmails();
            fetchInbox();
        }

        function selectEmail(email) {
            selectedEmail = email;
            renderEmailList();
            updateCurrentEmailDisplay();
            fetchInbox();
        }

        function deleteEmail(email, event) {
            event.stopPropagation();
            if (confirm(`Are you sure you want to delete '${email}'?`)) {
                emails = emails.filter(e => e !== email);
                if (selectedEmail === email) {
                    selectedEmail = emails.length > 0 ? emails[0] : null;
                }
                saveEmails();
                
                if (API_BASE_URL) {
                    fetch(`${API_BASE_URL}/api/inbox?email=${email}`, { method: 'DELETE' }).catch(console.error);
                }
                
                if (emails.length === 0) {
                    document.getElementById('inboxContainer').innerHTML = `
                        <div class="h-full flex flex-col items-center justify-center text-slate-400 space-y-3 py-16">
                            <div class="w-14 h-14 rounded-2xl bg-slate-100 flex items-center justify-center text-slate-400 text-xl shadow-inner">
                                <i class="fa-solid fa-envelope-open"></i>
                            </div>
                            <p class="text-sm font-semibold text-slate-600">Mailbox list is empty</p>
                        </div>
                    `;
                }
            }
        }

        function renderEmailList() {
            const listContainer = document.getElementById('emailList');
            const generateBtn = document.getElementById('generateBtn');
            const emailCount = document.getElementById('emailCount');
            
            emailCount.innerText = emails.length;
            generateBtn.disabled = emails.length >= MAX_EMAILS;
            generateBtn.classList.toggle('opacity-50', emails.length >= MAX_EMAILS);

            if (emails.length === 0) {
                listContainer.innerHTML = `<div class="text-center text-slate-400 text-xs py-12">No active addresses found.</div>`;
                return;
            }

            listContainer.innerHTML = emails.map(email => `
                <div onclick="selectEmail('${email}')" class="group p-3 rounded-xl cursor-pointer flex justify-between items-center transition-all border ${selectedEmail === email ? 'bg-indigo-50/80 border-indigo-200 text-indigo-900 shadow-2xs' : 'bg-slate-50/50 hover:bg-slate-100/80 border-transparent text-slate-700'}">
                    <div class="truncate text-xs font-medium mr-2 flex items-center gap-2">
                        <i class="fa-regular fa-envelope ${selectedEmail === email ? 'text-indigo-600' : 'text-slate-400'}"></i>
                        <span class="truncate font-mono">${email}</span>
                    </div>
                    <button onclick="deleteEmail('${email}', event)" class="text-slate-400 hover:text-rose-600 p-1.5 rounded-lg hover:bg-white transition-colors" title="Delete Address">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                    </button>
                </div>
            `).join('');
        }

        function updateCurrentEmailDisplay() {
            const display = document.getElementById('currentEmailDisplay');
            const copyBtn = document.getElementById('copyBtn');

            if (selectedEmail) {
                display.innerText = selectedEmail;
                copyBtn.classList.remove('hidden');
            } else {
                display.innerText = 'No mailbox selected';
                copyBtn.classList.add('hidden');
            }
        }

        function copyCurrentEmail() {
            if (!selectedEmail) return;
            const el = document.createElement('textarea');
            el.value = selectedEmail;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            
            const btn = document.getElementById('copyBtn');
            btn.innerHTML = '<i class="fa-solid fa-check text-emerald-600 text-sm"></i>';
            setTimeout(() => {
                btn.innerHTML = '<i class="fa-regular fa-copy text-sm"></i>';
            }, 2000);
        }

        async function fetchInbox() {
            if (!selectedEmail) return;
            
            const icon = document.getElementById('refreshIcon');
            icon.classList.add('fa-spin');
            
            const inboxContainer = document.getElementById('inboxContainer');
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/inbox?email=${selectedEmail}`);
                const data = await response.json();
                
                icon.classList.remove('fa-spin');

                if (!data || data.length === 0) {
                    inboxContainer.innerHTML = `
                        <div class="h-full flex flex-col items-center justify-center text-slate-400 space-y-3 py-16">
                            <div class="w-14 h-14 rounded-2xl bg-slate-100 flex items-center justify-center text-slate-400 text-xl shadow-inner">
                                <i class="fa-solid fa-inbox"></i>
                            </div>
                            <p class="text-sm font-semibold text-slate-600">No messages received yet</p>
                            <p class="text-xs text-slate-400">Waiting for incoming verification emails...</p>
                        </div>
                    `;
                    return;
                }

                inboxContainer.innerHTML = data.map(mail => `
                    <div class="bg-white rounded-2xl p-4 lg:p-5 border border-slate-200 shadow-2xs space-y-3">
                        <div class="flex flex-col sm:flex-row sm:justify-between sm:items-start gap-1 border-b border-slate-100 pb-3">
                            <div class="font-semibold text-slate-900 text-xs sm:text-sm break-all">
                                From: <span class="text-slate-600 font-normal">${mail.from.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</span>
                            </div>
                            <div class="text-[11px] text-slate-400 bg-slate-50 px-2.5 py-1 rounded-md border border-slate-100 self-start font-mono">
                                ${new Date(mail.date).toLocaleString()}
                            </div>
                        </div>
                        <div class="text-sm font-bold text-slate-900">
                            Subject: ${mail.subject}
                        </div>
                        <div class="text-xs sm:text-sm text-slate-700 bg-slate-50 p-4 rounded-xl border border-slate-100 overflow-x-auto leading-relaxed font-sans">
                            ${mail.body}
                        </div>
                    </div>
                `).join('');

            } catch (error) {
                icon.classList.remove('fa-spin');
                inboxContainer.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-rose-500 space-y-2 py-16">
                        <i class="fa-solid fa-triangle-exclamation text-2xl"></i>
                        <p class="text-xs font-medium">Failed to connect to backend server API.</p>
                    </div>
                `;
            }
        }

        renderEmailList();
        updateCurrentEmailDisplay();
        if (selectedEmail) fetchInbox();
    </script>
</body>
</html>
