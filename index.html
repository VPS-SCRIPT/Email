<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ActiveVPN - Secure Mail Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #0f172a; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Custom UI Enhancements */
        .glass-header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .mail-card { transition: all 0.2s ease-in-out; }
        .mail-card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-indigo-600 selection:text-white">

    <!-- Top Navigation -->
    <header class="glass-header border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-[72px] flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 rounded-xl bg-white shadow-sm border border-slate-100 flex items-center justify-center p-1">
                    <img src="https://raw.githubusercontent.com/VPS-SCRIPT/activevpn.net/main/image/1786624647999.png" alt="Logo" class="w-full h-full object-contain" onerror="this.src='https://via.placeholder.com/40'">
                </div>
                <div>
                    <h1 class="font-bold text-slate-900 tracking-tight text-xl leading-tight">ActiveVPN</h1>
                    <p class="text-[11px] font-semibold text-indigo-600 uppercase tracking-wider">Mail Suite Enterprise</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 bg-emerald-50 border border-emerald-200 rounded-full text-emerald-700 text-xs font-bold shadow-sm">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> SYSTEM ONLINE
                </div>
                <a href="https://t.me/Pussy1990" target="_blank" class="flex items-center gap-2 px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-sm font-semibold transition-colors shadow-md">
                    <i class="fa-brands fa-telegram text-sky-400"></i> Support
                </a>
            </div>
        </div>
    </header>

    <!-- Main Layout -->
    <main class="max-w-7xl w-full mx-auto flex-1 flex flex-col lg:flex-row p-4 lg:p-6 gap-6">
        
        <!-- Left Sidebar: Management Panel -->
        <section class="w-full lg:w-80 flex flex-col gap-5 shrink-0">
            <!-- Generate Box -->
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 flex flex-col gap-4 relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-indigo-500"></div>
                <div class="flex justify-between items-center mt-1">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500">Your Addresses</h2>
                    <span class="text-xs font-bold text-indigo-700 bg-indigo-50 border border-indigo-100 px-2.5 py-1 rounded-md shadow-sm"><span id="emailCount">0</span> / 5</span>
                </div>
                <button onclick="generateNewEmail()" id="generateBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-4 rounded-xl transition-all shadow-md flex items-center justify-center gap-2 text-sm active:scale-[0.98]">
                    <i class="fa-solid fa-plus-circle"></i> Generate New Mail
                </button>
                <p id="limitWarning" class="text-rose-500 text-xs text-center hidden font-bold bg-rose-50 p-2 rounded-lg border border-rose-100">Limit reached (5/5)</p>
            </div>

            <!-- Email List Box -->
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm flex-1 flex flex-col overflow-hidden min-h-[260px] lg:min-h-[360px]">
                <div class="px-5 py-4 border-b border-slate-100 bg-slate-50/80 flex items-center gap-2">
                    <i class="fa-solid fa-list-ul text-slate-400 text-sm"></i>
                    <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Active Mailboxes</span>
                </div>
                <div class="flex-1 overflow-y-auto p-3 space-y-2" id="emailList">
                    <!-- Dynamic List -->
                </div>
            </div>
        </section>

        <!-- Right Content: Workspace & Inbox -->
        <section class="flex-1 flex flex-col gap-5 min-w-0">
            <!-- Active Mail Control Header -->
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div class="min-w-0 flex-1">
                    <span class="text-[11px] font-bold uppercase tracking-widest text-slate-400 block mb-1.5">Currently Viewing Inbox For</span>
                    <div class="flex items-center gap-3">
                        <span class="text-lg sm:text-xl font-bold text-slate-900 truncate font-mono select-all" id="currentEmailDisplay">No mailbox selected</span>
                        <button onclick="copyCurrentEmail()" id="copyBtn" class="hidden flex-shrink-0 bg-slate-100 hover:bg-indigo-50 text-slate-500 hover:text-indigo-600 border border-slate-200 hover:border-indigo-200 w-8 h-8 rounded-lg flex items-center justify-center transition-all shadow-sm" title="Copy Address">
                            <i class="fa-regular fa-copy text-sm"></i>
                        </button>
                    </div>
                </div>
                <button onclick="fetchInbox()" class="w-full sm:w-auto bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 px-5 py-3 rounded-xl text-sm font-bold transition-all flex items-center justify-center gap-2 shadow-sm active:scale-95 shrink-0">
                    <i class="fa-solid fa-arrow-rotate-right text-indigo-500" id="refreshIcon"></i> Check Messages
                </button>
            </div>

            <!-- Messages Stream Area -->
            <div class="flex-1 overflow-y-auto space-y-5 pb-10" id="inboxContainer">
                <div class="h-full flex flex-col items-center justify-center text-slate-400 space-y-4 py-20 bg-white border border-slate-200 border-dashed rounded-2xl">
                    <div class="w-20 h-20 rounded-full bg-slate-50 border border-slate-100 flex items-center justify-center text-slate-300 text-3xl shadow-inner">
                        <i class="fa-regular fa-envelope-open"></i>
                    </div>
                    <div class="text-center">
                        <p class="text-base font-bold text-slate-600 mb-1">Inbox is empty</p>
                        <p class="text-sm text-slate-400 max-w-xs mx-auto leading-relaxed">Incoming emails, confirmation links, and OTP codes will appear here automatically.</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Application Script -->
    <script>
        const DOMAIN = 'activevpn.net';
        const MAX_EMAILS = 5;
        const API_BASE_URL = 'https://email.activevpn2026.workers.dev'; 
        const ITEM_LOGO_URL = 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTAE3NQ66aY4X5-AP0E0ykiH_G-K6ovWPV-csSgFomKaw&s=10';
        
        let emails = JSON.parse(localStorage.getItem('temp_emails')) || [];
        let selectedEmail = emails.length > 0 ? emails[0] : null;

        // Initialize UI
        document.addEventListener("DOMContentLoaded", () => {
            renderEmailList();
            updateCurrentEmailDisplay();
            if (selectedEmail) fetchInbox();
        });

        function saveEmails() {
            localStorage.setItem('temp_emails', JSON.stringify(emails));
            renderEmailList();
            updateCurrentEmailDisplay();
        }

        function generateRandomString(length) {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        function generateNewEmail() {
            if (emails.length >= MAX_EMAILS) {
                const warning = document.getElementById('limitWarning');
                warning.classList.remove('hidden');
                setTimeout(() => warning.classList.add('hidden'), 3500);
                return;
            }
            const newAddress = `${generateRandomString(8)}@${DOMAIN}`;
            emails.unshift(newAddress);
            selectedEmail = newAddress;
            saveEmails();
            fetchInbox();
        }

        function selectEmail(email) {
            selectedEmail = email;
            renderEmailList();
            updateCurrentEmailDisplay();
            fetchInbox();
        }

        function deleteEmail(email, event) {
            event.stopPropagation();
            if (confirm(`Delete mailbox '${email}'?`)) {
                emails = emails.filter(e => e !== email);
                if (selectedEmail === email) {
                    selectedEmail = emails.length > 0 ? emails[0] : null;
                }
                saveEmails();
                if (API_BASE_URL) fetch(`${API_BASE_URL}/api/inbox?email=${email}`, { method: 'DELETE' }).catch(console.error);
                
                if (emails.length === 0) {
                    document.getElementById('inboxContainer').innerHTML = `
                        <div class="h-full flex flex-col items-center justify-center text-slate-400 space-y-4 py-20 bg-white border border-slate-200 border-dashed rounded-2xl">
                            <div class="w-20 h-20 rounded-full bg-slate-50 border border-slate-100 flex items-center justify-center text-slate-300 text-3xl shadow-inner">
                                <i class="fa-solid fa-ghost"></i>
                            </div>
                            <div class="text-center">
                                <p class="text-base font-bold text-slate-600 mb-1">No Active Mailboxes</p>
                                <p class="text-sm text-slate-400 max-w-xs mx-auto">Generate a new email address to start receiving messages.</p>
                            </div>
                        </div>
                    `;
                } else {
                    fetchInbox();
                }
            }
        }

        function renderEmailList() {
            const listContainer = document.getElementById('emailList');
            const generateBtn = document.getElementById('generateBtn');
            
            document.getElementById('emailCount').innerText = emails.length;
            generateBtn.disabled = emails.length >= MAX_EMAILS;
            generateBtn.classList.toggle('opacity-50', emails.length >= MAX_EMAILS);

            if (emails.length === 0) {
                listContainer.innerHTML = `<div class="text-center text-slate-400 text-sm font-medium py-12">No mailboxes created yet.</div>`;
                return;
            }

            listContainer.innerHTML = emails.map(email => `
                <div onclick="selectEmail('${email}')" class="group p-3 rounded-xl cursor-pointer flex justify-between items-center transition-all border ${selectedEmail === email ? 'bg-indigo-50 border-indigo-200 shadow-sm' : 'bg-white hover:bg-slate-50 border-slate-100'}">
                    <div class="truncate text-xs font-bold mr-2 flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg overflow-hidden shrink-0 shadow-sm border border-slate-200/60 ${selectedEmail === email ? 'ring-2 ring-indigo-400 ring-offset-1' : ''}">
                            <img src="${ITEM_LOGO_URL}" alt="Mail Logo" class="w-full h-full object-cover">
                        </div>
                        <span class="truncate font-mono ${selectedEmail === email ? 'text-indigo-900' : 'text-slate-600'}">${email}</span>
                    </div>
                    <button onclick="deleteEmail('${email}', event)" class="text-slate-300 hover:text-white hover:bg-rose-500 w-8 h-8 rounded-lg flex items-center justify-center transition-colors" title="Delete">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                    </button>
                </div>
            `).join('');
        }

        function updateCurrentEmailDisplay() {
            const display = document.getElementById('currentEmailDisplay');
            const copyBtn = document.getElementById('copyBtn');

            if (selectedEmail) {
                display.innerText = selectedEmail;
                copyBtn.classList.remove('hidden');
            } else {
                display.innerText = 'No mailbox selected';
                copyBtn.classList.add('hidden');
            }
        }

        function copyCurrentEmail() {
            if (!selectedEmail) return;
            const el = document.createElement('textarea');
            el.value = selectedEmail;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            
            const btn = document.getElementById('copyBtn');
            btn.innerHTML = '<i class="fa-solid fa-check text-emerald-500 text-sm"></i>';
            btn.classList.add('border-emerald-200', 'bg-emerald-50');
            setTimeout(() => {
                btn.innerHTML = '<i class="fa-regular fa-copy text-sm"></i>';
                btn.classList.remove('border-emerald-200', 'bg-emerald-50');
            }, 2000);
        }

        // ==========================================
        // UI PARSER: Format Message nicely (UPDATED SAFE OTP)
        // ==========================================
        function processEmailContent(rawText) {
            // 1. Extract Links (Find http or https)
            const urlRegex = /(https?:\/\/[^\s"'<>\\]+)/g;
            const links = [];
            let match;
            while ((match = urlRegex.exec(rawText)) !== null) {
                // Clean trailing punctuation
                let cleanLink = match[1].replace(/[.,;:)]+$/, '');
                if (!links.includes(cleanLink)) links.push(cleanLink);
            }

            // 2. Safely Extract OTPs (အမှိုက် HTML နဲ့ CSS များကို ဖယ်ရှားပြီးမှ ဂဏန်းရှာမည်)
            let textOnly = rawText
                .replace(/<style[^>]*>[\s\S]*?<\/style>/gi, ' ') // Remove CSS Blocks
                .replace(/<[^>]+>/g, ' ') // Remove HTML Tags
                .replace(/[&#;]/g, ' '); // Remove HTML Entities

            const otpRegex = /(?:^|\s|:\s*)(\d{4,8})(?=\s|$|\.)/g;
            let otps = [];
            let otpMatch;
            while ((otpMatch = otpRegex.exec(textOnly)) !== null) {
                otps.push(otpMatch[1]);
            }
            // Remove common false positive numbers (years)
            otps = [...new Set(otps)].filter(code => !['2023','2024','2025','2026','1990'].includes(code));

            let html = '';

            // --- ACTION PANEL (If links or OTPs exist) ---
            if (links.length > 0 || otps.length > 0) {
                html += `<div class="bg-gradient-to-br from-indigo-50 to-blue-50 border border-indigo-100 rounded-xl p-5 mb-6 shadow-sm">`;
                html += `<h4 class="text-[11px] font-bold text-indigo-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                            <i class="fa-solid fa-bolt"></i> Smart Extracted Data
                         </h4>`;
                
                // Render OTPs
                if (otps.length > 0) {
                    html += `<div class="mb-4">
                                <span class="block text-xs font-bold text-slate-500 mb-2">Verification Codes:</span>
                                <div class="flex flex-wrap gap-3">`;
                    otps.forEach(otp => {
                        html += `<button onclick="navigator.clipboard.writeText('${otp}'); this.innerHTML='COPIED!';" class="bg-white border-2 border-indigo-200 text-indigo-700 hover:bg-indigo-600 hover:border-indigo-600 hover:text-white px-6 py-2.5 rounded-lg text-xl font-black tracking-[0.15em] transition-all shadow-sm focus:ring-4 focus:ring-indigo-100 min-w-[120px]" title="Click to copy">${otp}</button>`;
                    });
                    html += `   </div>
                             </div>`;
                }

                // Render Links
                if (links.length > 0) {
                    html += `<div class="${otps.length > 0 ? 'mt-4 pt-4 border-t border-indigo-100/50' : ''}">
                                <span class="block text-xs font-bold text-slate-500 mb-2">Action Links:</span>
                                <div class="flex flex-col gap-2.5">`;
                    links.forEach(link => {
                        html += `<a href="${link}" target="_blank" class="inline-flex items-center gap-3 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold px-5 py-3 rounded-lg transition-all shadow-md hover:shadow-lg w-fit max-w-full group">
                                    <span>Open Confirmation Link</span>
                                    <i class="fa-solid fa-arrow-up-right-from-square text-xs opacity-70 group-hover:opacity-100 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-all"></i>
                                 </a>
                                 <span class="text-[10px] text-slate-400 truncate w-full max-w-md block pl-1">${link}</span>`;
                    });
                    html += `   </div>
                             </div>`;
                }
                html += `</div>`;
            }

            // --- ORIGINAL MESSAGE BODY (HTML vs Text) ---
            const isHtml = /<html|<body|<table|<div/i.test(rawText);

            if (isHtml) {
                // Render HTML Email in Iframe
                let base64Encoded = '';
                try {
                    base64Encoded = btoa(unescape(encodeURIComponent(rawText)));
                } catch (e) {
                    base64Encoded = btoa(rawText);
                }
                
                html += `<div>
                            <span class="block text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-2"><i class="fa-solid fa-desktop mr-1"></i> Email View</span>
                            <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-inner h-[600px] w-full resize-y">
                                <iframe src="data:text/html;charset=utf-8;base64,${base64Encoded}" class="w-full h-full border-none bg-white"></iframe>
                            </div>
                         </div>`;
            } else {
                // Render Plain Text
                let safeText = rawText.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                let highlightedText = safeText.replace(urlRegex, function(url) {
                    let cleanUrl = url.replace(/[.,;:)]+$/, '');
                    return `<a href="${cleanUrl}" target="_blank" class="text-indigo-600 hover:text-indigo-800 underline underline-offset-2 break-all font-medium">${cleanUrl}</a>`;
                });

                html += `<div>
                            <span class="block text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-2"><i class="fa-solid fa-align-left mr-1"></i> Original Message</span>
                            <div class="bg-slate-50 border border-slate-200 rounded-xl p-5 text-sm text-slate-700 font-sans whitespace-pre-wrap leading-relaxed shadow-inner break-words">
                                ${highlightedText}
                            </div>
                         </div>`;
            }

            return html;
        }

        async function fetchInbox() {
            if (!selectedEmail) return;
            
            const icon = document.getElementById('refreshIcon');
            icon.classList.add('fa-spin');
            
            const inboxContainer = document.getElementById('inboxContainer');
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/inbox?email=${selectedEmail}`);
                const data = await response.json();
                
                icon.classList.remove('fa-spin');

                if (!data || data.length === 0) {
                    inboxContainer.innerHTML = `
                        <div class="h-full flex flex-col items-center justify-center text-slate-400 space-y-4 py-20 bg-white border border-slate-200 border-dashed rounded-2xl">
                            <div class="w-20 h-20 rounded-full bg-slate-50 border border-slate-100 flex items-center justify-center text-slate-300 text-3xl shadow-inner">
                                <i class="fa-regular fa-clock"></i>
                            </div>
                            <div class="text-center">
                                <p class="text-base font-bold text-slate-600 mb-1">Waiting for messages...</p>
                                <p class="text-sm text-slate-400 max-w-xs mx-auto">Inbox is empty. Try refreshing in a few moments.</p>
                            </div>
                        </div>
                    `;
                    return;
                }

                inboxContainer.innerHTML = data.map(mail => `
                    <article class="mail-card bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                        <!-- Header -->
                        <div class="px-5 py-4 border-b border-slate-100 bg-slate-50/50 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3">
                            <div class="flex items-center gap-3 min-w-0">
                                <div class="w-10 h-10 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold text-lg shrink-0">
                                    ${mail.from.charAt(0).toUpperCase()}
                                </div>
                                <div class="min-w-0">
                                    <p class="text-sm font-bold text-slate-900 truncate" title="${mail.from.replace(/</g, '&lt;').replace(/>/g, '&gt;')}">
                                        ${mail.from.replace(/</g, '&lt;').replace(/>/g, '&gt;')}
                                    </p>
                                    <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Sender</p>
                                </div>
                            </div>
                            <div class="text-xs font-bold text-slate-500 bg-white border border-slate-200 px-3 py-1.5 rounded-lg shadow-sm shrink-0 font-mono">
                                ${new Date(mail.date).toLocaleString()}
                            </div>
                        </div>
                        
                        <!-- Body -->
                        <div class="p-5 lg:p-6">
                            <h3 class="text-lg font-bold text-slate-900 mb-6 pb-4 border-b border-slate-100">
                                <span class="text-slate-400 mr-2 font-normal text-sm">Subject:</span>${mail.subject}
                            </h3>
                            ${processEmailContent(mail.body)}
                        </div>
                    </article>
                `).join('');

            } catch (error) {
                icon.classList.remove('fa-spin');
                inboxContainer.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-rose-500 space-y-3 py-20 bg-rose-50 border border-rose-100 border-dashed rounded-2xl">
                        <i class="fa-solid fa-triangle-exclamation text-3xl"></i>
                        <p class="text-sm font-bold">Failed to fetch messages.</p>
                        <p class="text-xs text-rose-400">Please check your network or Worker URL.</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
